name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  distributions:
    name: Verify Python distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
      - name: Validate release tag ancestry and type
        run: |
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Use the tag commit timestamp for build inputs
        run: printf 'SOURCE_DATE_EPOCH=%s\n' "$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run bandit -q -c pyproject.toml -r src scripts
      - name: Audit locked runtime dependencies
        run: |
          uv export --locked --extra pdf --extra postgres --extra distributed --extra secure --extra ml --no-dev --no-emit-project --format requirements-txt --output-file audit-requirements.txt
          uv run pip-audit --cache-dir .cache/pip-audit --no-deps --disable-pip -r audit-requirements.txt
      - name: Build and validate distributions
        run: |
          uv build --clear --no-create-gitignore
          uv run twine check dist/*.whl dist/*.tar.gz
          uv run python scripts/release_check.py --dist-dir dist --tag "$GITHUB_REF_NAME"
      - name: Install and smoke-test the wheel
        run: |
          uv venv /tmp/osint-recon-release --python 3.12
          uv pip install --python /tmp/osint-recon-release/bin/python dist/*.whl
          /tmp/osint-recon-release/bin/recon --help
          /tmp/osint-recon-release/bin/specter --help
      - name: Create checksums
        run: sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS
      - name: Attest release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: osint-recon-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  container:
    name: Publish production container
    needs: distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Smoke-test the release image locally
        run: |
          docker build \
            --build-arg VERSION="${GITHUB_REF_NAME#v}" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --tag osint-recon:release .
          docker run --rm osint-recon:release --help
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long,prefix=sha-
      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Attest the published image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  github-release:
    name: Publish GitHub Release
    needs: container
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: osint-recon-${{ github.ref_name }}
          path: dist
      - name: Create the immutable release record
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --prerelease
          --title "osint-recon ${GITHUB_REF_NAME#v}"
