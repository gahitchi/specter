name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to publish
        required: true
        type: string

concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish attested distributions
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/osint-recon
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the exact GitHub Release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir release-files dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-files \
            --pattern '*.whl' --pattern '*.tar.gz' --pattern SHA256SUMS
          (cd release-files && sha256sum --check SHA256SUMS)
          for artifact in release-files/*.whl release-files/*.tar.gz release-files/SHA256SUMS; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done
          cp release-files/*.whl release-files/*.tar.gz dist/
      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
