name: Feature request
description: Propose a focused capability or operational improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What authorized research or operating need is not met?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the workflow and expected evidence or safety properties.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Privacy, policy, and operational risks
      description: Note data sent, source terms, false-positive risk, and deployment impact.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I did not include credentials, personal data, reports, databases, or canary identities.
          required: true
