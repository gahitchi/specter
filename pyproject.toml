[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-recon"
version = "0.11.0"
description = "Specter local-first OSINT research with recursive collection, evidence-aware verification, correlation, and monitoring."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "gahitchi" }]
keywords = [
    "osint",
    "reconnaissance",
    "investigation",
    "threat-intelligence",
    "digital-forensics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "httpx[http2]>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "phonenumbers>=8.13",
    "dnspython>=2.6",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10",
    "jellyfish>=1.0",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
pdf = ["weasyprint>=60"]
postgres = ["psycopg[binary]>=3.1"]
distributed = ["arq>=0.25", "redis>=5.0"]
secure = ["cryptography>=44", "keyring>=25"]
ml = ["scikit-learn>=1.5"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "bandit>=1.8",
    "pip-audit>=2.9",
    "twine>=6.0",
]

[project.urls]
Homepage = "https://github.com/gahitchi/osint-recon"
Documentation = "https://github.com/gahitchi/osint-recon/blob/main/README.md"
Repository = "https://github.com/gahitchi/osint-recon.git"
Issues = "https://github.com/gahitchi/osint-recon/issues"
Changelog = "https://github.com/gahitchi/osint-recon/blob/main/CHANGELOG.md"

[project.scripts]
recon = "recon.cli:main"
specter = "recon.launch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recon = [
    "data/*.json",
    "web/*.html",
    "web/*.css",
    "web/*.js",
    "migrations/*.mako",
    "migrations/versions/*.py",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# pyflakes (F) catches dead imports / undefined names; pycodestyle errors (E)
# catch real syntax-level smells. Kept deliberately tight so the gate stays green
# and meaningful rather than a wall of stylistic noise.
select = ["F", "E"]
# E501 line-too-long is advisory here; wrapping is left to author judgement.
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=recon --cov-report=term-missing --cov-fail-under=68"
filterwarnings = [
    "error::ResourceWarning",
    # Starlette's TestClient still imports httpx; upstream-only, not our code.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B404", "B603"]
